services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: marketledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketledger"]
      interval: 2s
      timeout: 3s
      retries: 30
